<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Image Grid Layout</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.skypack.dev/sanitize.css" rel="stylesheet" />
    <link href="https://unpkg.com/sanitize.css/forms.css" rel="stylesheet" />
    <link href="https://unpkg.com/sanitize.css/assets.css" rel="stylesheet" />
    <link
      href="https://unpkg.com/sanitize.css/typography.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/sanitize.css/reduce-motion.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/sanitize.css/system-ui.css"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/sanitize.css/ui-monospace.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <figure>
        <img
          class="big"
          src="assets/jasper-gribble-TTExgxV06KA-unsplash.jpg"
          alt="A foggy beach with a large rock formation in the foreground"
        /><img
          src="assets/pawel-czerwinski-Wuu6H3mI7UA-unsplash.jpg"
          alt="A living room with a white couch and a round window"
        /><img
          src="assets/bernhard-uTd-kylh7bE-unsplash.jpg"
          alt="A building with a red door and a tree in front of it"
          class="big"
        /><img
          src="assets/florian-schmid-f1PzRPbqt0M-unsplash.jpg"
          alt="A row of white apartment buildings next to a street"
          class="big"
        /><img
          src="assets/megan-watson-p2OQW69vXP4-unsplash.jpg"
          alt="brown wooden board"
        /><img
          src="assets/geio-tischler-VKFHp6UQncE-unsplash.jpg"
          alt="an aerial view of a beach with umbrellas and chairs"
        />
        <figcaption>Gallery</figcaption>
      </figure>
    </main>
  </body>
</html>
